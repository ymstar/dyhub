<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DyHub 图形标（简化矢量版）：中心节点 + 三条连线 + 三个对话气泡 -->
  <defs>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EC9E8"/>
      <stop offset="1" stop-color="#2B8EC4"/>
    </linearGradient>
    <linearGradient id="bubGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7AA8"/>
      <stop offset="1" stop-color="#F24E8A"/>
    </linearGradient>
  </defs>

  <!-- 连线：中心节点 → 三个气泡 -->
  <path d="M256 240 C 210 200, 200 190, 176 168" stroke="#32E4EE" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M256 240 C 302 200, 312 190, 336 168" stroke="#32E4EE" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M256 280 C 256 300, 256 310, 256 330" stroke="#32E4EE" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- 中心节点 -->
  <circle cx="256" cy="262" r="34" fill="url(#hubGrad)"/>
  <circle cx="256" cy="262" r="34" fill="none" stroke="rgba(50,228,238,0.55)" stroke-width="6"/>

  <!-- 左上气泡 -->
  <path d="M120 116 h90 a26 26 0 0 1 26 26 v40 a26 26 0 0 1 -26 26 h-62 l-30 26 v-26 h-8 a26 26 0 0 1 -26 -26 v-40 a26 26 0 0 1 26 -26 z" fill="url(#bubGrad)"/>
  <!-- 右上气泡 -->
  <path d="M392 116 h-90 a26 26 0 0 0 -26 26 v40 a26 26 0 0 0 26 26 h62 l30 26 v-26 h8 a26 26 0 0 0 26 -26 v-40 a26 26 0 0 0 -26 -26 z" fill="url(#bubGrad)"/>
  <!-- 下方气泡 -->
  <path d="M216 392 h80 a26 26 0 0 0 26 -26 v-36 a26 26 0 0 0 -26 -26 h-80 a26 26 0 0 0 -26 26 v36 a26 26 0 0 0 26 26 z" fill="url(#bubGrad)"/>
</svg>
